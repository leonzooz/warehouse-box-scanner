<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Anling 工作台</title>
  <style>
    :root { --bg:#071019; --panel:#101a25; --panel2:#172536; --text:#edf6ff; --muted:#96a8bb; --line:#2a3a50; --accent:#22b8ff; --ok:#45d48d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif; }
    .app { width:min(100%,920px); margin:0 auto; padding:24px 16px 48px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:20px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; min-width:0; }.brand-mark { display:grid; place-items:center; width:34px; height:34px; border-radius:8px; background:var(--accent); color:#062033; font-weight:900; }.brand h1 { margin:0; font-size:22px; }.brand p { margin:2px 0 0; color:var(--muted); font-size:13px; }
    .tenant { padding:7px 10px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:var(--panel); font-size:13px; white-space:nowrap; }
    main { padding-top:28px; }.section-title { margin:0 0 12px; font-size:17px; }.module-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .module { position:relative; min-height:154px; display:flex; flex-direction:column; padding:18px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text); text-decoration:none; overflow:hidden; transition:border-color .15s, transform .15s; }.module.active:hover { border-color:var(--accent); transform:translateY(-2px); }.module-icon { width:38px; height:38px; display:grid; place-items:center; border:1px solid var(--line); border-radius:8px; background:var(--panel2); color:var(--accent); }.module h2 { margin:16px 0 4px; font-size:19px; }.module p { margin:0; color:var(--muted); font-size:14px; line-height:1.45; }.module .state { margin-top:auto; padding-top:15px; color:var(--ok); font-size:13px; font-weight:700; }.module.locked { opacity:.62; cursor:default; }.module.locked .state { color:var(--muted); }
    .activity { margin-top:28px; padding-top:24px; border-top:1px solid var(--line); }.activity-row { display:flex; align-items:center; gap:10px; min-height:52px; padding:0 14px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--muted); font-size:14px; }.activity-dot { width:8px; height:8px; border-radius:50%; background:var(--ok); flex:0 0 auto; }
    svg { width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    @media (max-width:560px) { .app { padding:16px 12px 36px; }.topbar { align-items:flex-start; }.module-grid { grid-template-columns:1fr; }.brand h1 { font-size:20px; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><div class="brand-mark">A</div><div><h1 id="company-name">Anling</h1><p>工作台</p></div></div><div id="tenant-id" class="tenant">anling</div></header>
    <section><h2 class="section-title">作業模組</h2><div class="module-grid">
      <a class="module active" href="warehouse/"><div class="module-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="m3 7.5 9 4.5 9-4.5M12 12v9"/></svg></div><h2>倉庫紙箱</h2><p>拍攝面籤並記錄紙箱型號。</p><div class="state">已啟用</div></a>
      <div class="module locked" aria-label="淘寶入庫尚未啟用"><div class="module-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v6h6M21 21v-6h-6"/><path d="M21 9A9 9 0 0 0 6 5.3L3 9m0 6a9 9 0 0 0 15 3.7L21 15"/></svg></div><h2>淘寶入庫</h2><p>掃描商品標籤與入庫資料。</p><div class="state">準備中</div></div>
      <div class="module locked" aria-label="回款作業台尚未啟用"><div class="module-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.4-1-1.5-1.5-3-1.5-1.7 0-3 1-3 2.3 0 3.2 6 1.3 6 4.5 0 1.3-1.3 2.2-3 2.2-1.5 0-2.7-.6-3.2-1.7M12 6v12"/></svg></div><h2>回款作業台</h2><p>應收款、對帳與回款紀錄。</p><div class="state">準備中</div></div>
      <div class="module locked" aria-label="管理後台尚未啟用"><div class="module-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7m5 7V3m5 18v-9m5 9V8"/></svg></div><h2>管理後台</h2><p>人員、權限與營運資料。</p><div class="state">準備中</div></div>
    </div></section>
    <section class="activity"><h2 class="section-title">系統狀態</h2><div class="activity-row"><span class="activity-dot"></span><span>倉庫紙箱模組可使用</span></div></section>
  </main>
  <script src="tenants.js"></script>
  <script>
    var tenant = window.resolveLoginAiTenant();
    document.title = tenant.companyName + " 工作台";
    document.getElementById("company-name").textContent = tenant.companyName;
    document.getElementById("tenant-id").textContent = tenant.id;
    document.documentElement.style.setProperty("--accent", tenant.primaryColor || "#22b8ff");
  </script>
</body>
</html>
