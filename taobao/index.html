<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>淘寶入庫</title>
  <script src="https://unpkg.com/jsqr/dist/jsQR.js"></script>
  <style>
    :root {
      --bg: #071019;
      --panel: #101a25;
      --panel2: #172536;
      --text: #edf6ff;
      --muted: #96a8bb;
      --line: #2a3a50;
      --accent: #22b8ff;
      --ok: #45d48d;
      --warn: #ffcc66;
      --bad: #ff7070;
      --shade: rgba(0, 0, 0, .58);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 10px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .pill {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .nav-tabs a {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
    }

    .nav-tabs a.active {
      border-color: var(--accent);
      color: var(--text);
      background: var(--panel2);
    }

    .camera-card {
      position: relative;
      overflow: hidden;
      min-height: 72vh;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #02060a;
    }

    #camera {
      width: 100%;
      height: 72vh;
      object-fit: cover;
      display: block;
      background: #02060a;
    }

    .scan-ui,
    .photo-ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .review-preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #02060a;
      z-index: 4;
    }

    .skip-qr {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 5;
      width: auto;
      min-height: 44px;
      padding: 9px 12px;
    }

    .camera-action,
    .review-actions {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 5;
      pointer-events: auto;
    }

    .review-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .sort-overlay {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 82px;
      z-index: 6;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: center;
      min-height: 56px;
      border: 1px solid rgba(69, 212, 141, .55);
      border-radius: 8px;
      padding: 10px 12px;
      background: rgba(7, 16, 25, .9);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
      pointer-events: none;
    }

    .sort-overlay-label {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .sort-overlay-value {
      color: var(--ok);
      font-size: 24px;
      font-weight: 900;
      line-height: 1.1;
      text-align: right;
    }

    .sort-overlay.pending {
      border-color: rgba(255, 204, 102, .5);
    }

    .sort-overlay.pending .sort-overlay-value {
      color: var(--warn);
    }

    .scan-mask {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(var(--shade), var(--shade)) top / 100% calc(var(--box-top) * 1px) no-repeat,
        linear-gradient(var(--shade), var(--shade)) left calc(var(--box-top) * 1px) / calc(var(--box-left) * 1px) calc(var(--box-size) * 1px) no-repeat,
        linear-gradient(var(--shade), var(--shade)) right calc(var(--box-top) * 1px) / calc(100% - (var(--box-left) + var(--box-size)) * 1px) calc(var(--box-size) * 1px) no-repeat,
        linear-gradient(var(--shade), var(--shade)) bottom / 100% calc(100% - (var(--box-top) + var(--box-size)) * 1px) no-repeat;
    }

    .scan-box {
      position: absolute;
      left: calc(var(--box-left) * 1px);
      top: calc(var(--box-top) * 1px);
      width: calc(var(--box-size) * 1px);
      height: calc(var(--box-size) * 1px);
      border: 4px solid #fff;
      border-radius: 8px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .28), 0 0 20px rgba(34, 184, 255, .34);
    }

    .scan-box::before,
    .scan-box::after {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      height: 2px;
      background: rgba(34, 184, 255, .75);
    }

    .scan-box::before {
      top: 50%;
    }

    .scan-box::after {
      display: none;
    }

    .guide {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: rgba(16, 26, 37, .88);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      pointer-events: none;
    }

    .photo-ui .guide {
      top: 12px;
      bottom: auto;
    }

    .message {
      margin-top: 10px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .message.ok {
      color: var(--ok);
      border-color: rgba(69, 212, 141, .45);
    }

    .message.warn {
      color: var(--warn);
      border-color: rgba(255, 204, 102, .45);
    }

    .message.bad {
      color: var(--bad);
      border-color: rgba(255, 112, 112, .45);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 8px;
      padding: 13px 14px;
      background: var(--accent);
      color: #03131d;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--line);
    }

    button:disabled {
      opacity: .62;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .photo-panel {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    textarea,
    select {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
      background: #0d1621;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 70px;
      resize: vertical;
      color: var(--muted);
      word-break: break-all;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .ai-card {
      display: grid;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      padding: 12px;
    }

    .ai-title {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .ai-category {
      color: var(--ok);
      font-size: 24px;
      font-weight: 900;
      line-height: 1.2;
    }

    .ai-detail {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .category-picker {
      margin: 12px 0;
    }

    .category-picker summary {
      cursor: pointer;
      min-height: 44px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: var(--panel);
    }

    .category-picker[open] .category-grid {
      margin-top: 8px;
    }

    .category-btn {
      min-height: 48px;
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--line);
      padding: 10px 8px;
      font-size: 15px;
    }

    .category-btn.active {
      color: #03131d;
      background: var(--ok);
      border-color: var(--ok);
    }

    @media (max-width: 390px) {
      .app {
        padding: 8px;
      }

      #camera,
      .camera-card {
        min-height: 70vh;
        height: 70vh;
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <h1 id="app-title">淘寶入庫</h1>
      <div class="pill" id="mode">掃左下 QR</div>
    </div>


    <section class="camera-card" id="camera-card">
      <video id="camera" playsinline muted autoplay></video>

      <div id="scan-ui" class="scan-ui">
        <div class="scan-mask"></div>
        <div class="scan-box"></div>
        <div class="guide">把標籤左下角淘寶 QR 放進白框。右下角保險 QR 不要放進框內。</div>
      </div>

      <button id="skip-qr-btn" class="skip-qr secondary" type="button">無法掃碼，直接拍照</button>

      <div id="photo-ui" class="photo-ui hidden">
        <div class="guide">請把整張標籤放進畫面，按下方按鈕拍照並上傳。</div>
      </div>

      <img id="preview" class="review-preview hidden" alt="標籤照片預覽" />

      <div id="sort-overlay" class="sort-overlay pending hidden">
        <div class="sort-overlay-label">分貨區</div>
        <div id="sort-overlay-value" class="sort-overlay-value">待分類</div>
      </div>

      <div id="camera-action" class="camera-action hidden">
        <button id="capture-btn" type="button">拍標籤照</button>
      </div>

      <div id="review-actions" class="review-actions hidden">
        <button id="retake-btn" class="secondary" type="button">重拍</button>

      </div>

    <div id="message" class="message">正在啟動相機...</div>

    <div id="scan-controls" class="controls hidden">

      <label>
        狀態
        <select id="status">
          <option value="待整理" selected>待整理</option>
          <option value="待售">待售</option>
          <option value="問題件">問題件</option>
        </select>
      </label>

      <section id="ai-card" class="ai-card hidden">
        <div class="ai-title">AI 建議分貨區</div>
        <div id="ai-category" class="ai-category">待分類</div>
        <div id="ai-detail" class="ai-detail">拍照後會自動分析標籤。</div>
      </section>

      <details id="category-picker" class="category-picker">
        <summary>改分類</summary>
        <div id="category-grid" class="category-grid">
          <button class="category-btn active" type="button" data-category="待分類">待分類</button>
          <button class="category-btn" type="button" data-category="汽車配件">汽車配件</button>
          <button class="category-btn" type="button" data-category="機車配件">機車配件</button>
          <button class="category-btn" type="button" data-category="自行車用品">自行車用品</button>
          <button class="category-btn" type="button" data-category="居家收納">居家收納</button>
          <button class="category-btn" type="button" data-category="居家裝飾">居家裝飾</button>
          <button class="category-btn" type="button" data-category="寢具用品">寢具用品</button>
          <button class="category-btn" type="button" data-category="浴室用品">浴室用品</button>
          <button class="category-btn" type="button" data-category="廚房用品">廚房用品</button>
          <button class="category-btn" type="button" data-category="家電用品">家電用品</button>
          <button class="category-btn" type="button" data-category="燈具照明">燈具照明</button>
          <button class="category-btn" type="button" data-category="戶外露營">戶外露營</button>
          <button class="category-btn" type="button" data-category="運動用品">運動用品</button>
          <button class="category-btn" type="button" data-category="電腦周邊">電腦周邊</button>
          <button class="category-btn" type="button" data-category="手機配件">手機配件</button>
          <button class="category-btn" type="button" data-category="遊戲配件">遊戲配件</button>
          <button class="category-btn" type="button" data-category="攝影用品">攝影用品</button>
          <button class="category-btn" type="button" data-category="服飾用品">服飾用品</button>
          <button class="category-btn" type="button" data-category="鞋類">鞋類</button>
          <button class="category-btn" type="button" data-category="包包飾品">包包飾品</button>
          <button class="category-btn" type="button" data-category="兒童玩具">兒童玩具</button>
          <button class="category-btn" type="button" data-category="寵物用品">寵物用品</button>
          <button class="category-btn" type="button" data-category="五金工具">五金工具</button>
          <button class="category-btn" type="button" data-category="美妝個護">美妝個護</button>
          <button class="category-btn" type="button" data-category="其他">其他</button>
        </div>
      </details>

      <div class="controls">
        <button id="rescan-btn" class="secondary" type="button">重掃 QR</button>
        <button id="retry-camera-btn" class="secondary" type="button">重開相機</button>
      </div>
    </section>
  </main>

  <canvas id="work-canvas" class="hidden"></canvas>

  <script src="../tenants.js?v=20261013-1"></script>
  <script>
    const TENANT = window.resolveLoginAiTenant();
    const APPS_SCRIPT_URL = TENANT.taobaoScriptUrl || TENANT.appsScriptUrl;   // 淘寶入庫用自己的 Apps Script
    const tenantQuery = "?tenant=" + encodeURIComponent(TENANT.id);
    document.title = TENANT.companyName + "｜淘寶入庫";
    document.getElementById("app-title").textContent = TENANT.companyName + "｜淘寶入庫";
    document.documentElement.style.setProperty("--accent", TENANT.primaryColor || "#22b8ff");

    const cameraCard = document.getElementById("camera-card");
    const camera = document.getElementById("camera");
    const mode = document.getElementById("mode");
    const scanUi = document.getElementById("scan-ui");
    const photoUi = document.getElementById("photo-ui");
    const message = document.getElementById("message");
    const scanControls = document.getElementById("scan-controls");
    const cameraAction = document.getElementById("camera-action");
    const reviewActions = document.getElementById("review-actions");
    const startBtn = document.getElementById("start-btn");
    const skipQrBtn = document.getElementById("skip-qr-btn");
    const photoPanel = document.getElementById("photo-panel");
    const productUrl = document.getElementById("product-url");
    const statusInput = document.getElementById("status");
    const captureBtn = document.getElementById("capture-btn");
    const uploadBtn = document.getElementById("upload-btn");
    const retakeBtn = document.getElementById("retake-btn");
    const rescanBtn = document.getElementById("rescan-btn");
    const retryCameraBtn = document.getElementById("retry-camera-btn");
    const preview = document.getElementById("preview");
    const sortOverlay = document.getElementById("sort-overlay");
    const sortOverlayValue = document.getElementById("sort-overlay-value");
    const aiCard = document.getElementById("ai-card");
    const aiCategory = document.getElementById("ai-category");
    const aiDetail = document.getElementById("ai-detail");
    const categoryPicker = document.getElementById("category-picker");
    const categoryButtons = Array.from(document.querySelectorAll(".category-btn"));
    const canvas = document.getElementById("work-canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    let stream = null;
    let scanTimer = null;
    let scanInFlight = false;
    let currentMode = "scan";
    let qrStatus = "pending";
    const facingMode = "environment";
    let lastRejectAt = 0;
    let isUploading = false;
    let photoData = "";
    let classifyPhotoData = "";
    let photoName = "";
    let selectedSortArea = "待分類";
    let aiSortArea = "";
    let aiConfidence = "";
    let aiReason = "";
    let aiClassifiedAt = "";
    let classifyRunId = 0;
    let nativeQrDetector = null;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    try {
      if ("BarcodeDetector" in window) {
        nativeQrDetector = new BarcodeDetector({ formats: ["qr_code"] });
      }
    } catch (error) {
      console.warn("Native QR detector unavailable", error);
    }

    startBtn.addEventListener("click", startCamera);
    skipQrBtn.addEventListener("click", function() { enterPhotoMode("", "not_found"); });
    captureBtn.addEventListener("click", captureAndUpload);
    uploadBtn.addEventListener("click", submitData);
    retakeBtn.addEventListener("click", retakePhoto);
    rescanBtn.addEventListener("click", resetToScan);
    retryCameraBtn.addEventListener("click", startCamera);
    categoryButtons.forEach(function(button) {
      button.addEventListener("click", function() {
        setSelectedCategory(button.dataset.category || "待分類");
        categoryPicker.open = false;
      });
    });

    window.addEventListener("load", startCamera);
    window.addEventListener("resize", updateScanBox);
    window.addEventListener("pagehide", stopCamera);
    document.addEventListener("visibilitychange", function() {
      if (document.hidden) stopCamera();
    });

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message" + (type ? " " + type : "");
    }

    function isTaobaoLink(value) {
      const text = String(value || "").trim().toLowerCase();
      return text.includes("taobao.com") ||
        text.includes("item.taobao") ||
        text.includes("m.tb.cn") ||
        text.includes("tb.cn") ||
        text.includes("tmall.com");
    }

    async function startCamera() {
      if (isUploading) return;

      stopScanLoop();
      stopStream();
      showMessage("正在啟動相機...", "");
      startBtn.classList.add("hidden");

      try {
        const videoConstraints = isIOS ? {
          // This matches the original iPhone-proven scanner settings.
          facingMode: { ideal: facingMode },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        } : {
          facingMode: { ideal: facingMode },
          width: { ideal: 1920 },
          height: { ideal: 1440 },
          aspectRatio: { ideal: 4 / 3 }
        };

        stream = await navigator.mediaDevices.getUserMedia({
          video: videoConstraints,
        audio: false
      });

        camera.srcObject = stream;
        await camera.play();
        await optimizeCameraForScan();
        updateScanBox();

        if (currentMode === "scan") {
          startScanLoop();
          showMessage("請把左下角淘寶 QR 放進白框", "");
        } else {
          showMessage("請把整張標籤放進畫面後拍照", "");
        }
      } catch (error) {
        console.error(error);
        startBtn.classList.remove("hidden");
        showMessage("相機啟動失敗。請確認相機權限，並用 HTTPS 開啟頁面。", "bad");
      }
    }

    async function optimizeCameraForScan() {
      const track = stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
      if (!track || !track.getCapabilities || !track.applyConstraints) return;

      const capabilities = track.getCapabilities();
      const advanced = {};

      if (Array.isArray(capabilities.focusMode) && capabilities.focusMode.includes("continuous")) {
        advanced.focusMode = "continuous";
      }

      if (Array.isArray(capabilities.exposureMode) && capabilities.exposureMode.includes("continuous")) {
        advanced.exposureMode = "continuous";
      }

      if (Array.isArray(capabilities.whiteBalanceMode) && capabilities.whiteBalanceMode.includes("continuous")) {
        advanced.whiteBalanceMode = "continuous";
      }

      if (!Object.keys(advanced).length) return;

      try {
        await track.applyConstraints({ advanced: [advanced] });
      } catch (error) {
        console.warn("Could not optimize camera focus", error);
      }
    }

    function stopCamera() {
      stopScanLoop();
      stopStream();
    }

    function stopStream() {
      if (stream) {
        stream.getTracks().forEach(function(track) {
          track.stop();
        });
        stream = null;
      }
      camera.srcObject = null;
    }

    function setMode(nextMode) {
      currentMode = nextMode;
      mode.textContent = nextMode === "scan" ? "掃左下 QR" : "拍標籤";
      scanUi.classList.toggle("hidden", nextMode !== "scan");
      skipQrBtn.classList.toggle("hidden", nextMode !== "scan");
      photoUi.classList.toggle("hidden", nextMode !== "photo");
      scanControls.classList.toggle("hidden", nextMode !== "scan");
      photoPanel.classList.toggle("hidden", nextMode !== "photo");
      cameraAction.classList.toggle("hidden", nextMode !== "photo");
      reviewActions.classList.add("hidden");

      if (nextMode === "scan") {
        startScanLoop();
      } else {
        stopScanLoop();
      }
    }

    function updateScanBox() {
      const rect = cameraCard.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      const size = Math.round(Math.min(rect.width * 0.42, rect.height * 0.32, 230));
      const left = Math.round(rect.width * 0.08);
      const top = Math.round(rect.height * 0.53);

      cameraCard.style.setProperty("--box-size", size);
      cameraCard.style.setProperty("--box-left", left);
      cameraCard.style.setProperty("--box-top", top);
    }

    function startScanLoop() {
      stopScanLoop();
      if (currentMode !== "scan") return;
      scanTimer = window.setInterval(scanLeftBox, isIOS ? 260 : 220);
    }

    function stopScanLoop() {
      if (scanTimer) {
        window.clearInterval(scanTimer);
        scanTimer = null;
      }
    }

    async function scanLeftBox() {
      if (currentMode !== "scan" || !camera.videoWidth || !camera.videoHeight || isUploading || scanInFlight) return;

      scanInFlight = true;

      try {
        const cardRect = cameraCard.getBoundingClientRect();
        const videoRect = camera.getBoundingClientRect();
        const guideBox = getScanBoxCss();
        const padding = isIOS ? 0 : Math.round(guideBox.size * 0.18);
        const box = {
          left: Math.max(0, guideBox.left - padding),
          top: Math.max(0, guideBox.top - padding),
          size: guideBox.size + padding * 2
        };

        const videoRatio = camera.videoWidth / camera.videoHeight;
        const elementRatio = videoRect.width / videoRect.height;

        let drawnWidth;
        let drawnHeight;
        let offsetX = 0;
        let offsetY = 0;

        if (videoRatio > elementRatio) {
          drawnHeight = videoRect.height;
          drawnWidth = drawnHeight * videoRatio;
          offsetX = (videoRect.width - drawnWidth) / 2;
        } else {
          drawnWidth = videoRect.width;
          drawnHeight = drawnWidth / videoRatio;
          offsetY = (videoRect.height - drawnHeight) / 2;
        }

        const boxLeftInVideo = box.left + cardRect.left - videoRect.left;
        const boxTopInVideo = box.top + cardRect.top - videoRect.top;

        const sx = Math.max(0, Math.round((boxLeftInVideo - offsetX) * camera.videoWidth / drawnWidth));
        const sy = Math.max(0, Math.round((boxTopInVideo - offsetY) * camera.videoHeight / drawnHeight));
        const sw = Math.min(camera.videoWidth - sx, Math.round(box.size * camera.videoWidth / drawnWidth));
        const sh = Math.min(camera.videoHeight - sy, Math.round(box.size * camera.videoHeight / drawnHeight));

        if (sw <= 0 || sh <= 0) return;

        canvas.width = sw;
        canvas.height = sh;
        ctx.drawImage(camera, sx, sy, sw, sh, 0, 0, sw, sh);

        let scanned = "";

        if (nativeQrDetector) {
          try {
            const detected = await nativeQrDetector.detect(canvas);
            if (detected && detected[0] && detected[0].rawValue) {
              scanned = String(detected[0].rawValue).trim();
            }
          } catch (error) {
            console.warn("Native QR scan failed", error);
          }
        }

        if (!scanned) {
          const imageData = ctx.getImageData(0, 0, sw, sh);
          const code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: isIOS ? "dontInvert" : "attemptBoth"
          });
          scanned = code && code.data ? String(code.data).trim() : "";
        }

        if (!scanned) return;

        if (!isTaobaoLink(scanned)) {
          const now = Date.now();
          if (now - lastRejectAt > 1000) {
            lastRejectAt = now;
            showMessage("框內不是淘寶商品 QR，請對準左下角", "warn");
          }
          return;
        }

        enterPhotoMode(scanned, "scanned");
      } finally {
        scanInFlight = false;
      }
    }

    function enterPhotoMode(url, scanStatus) {
      if (isUploading || currentMode !== "scan") return;
      qrStatus = scanStatus;
      productUrl.value = url;
      statusInput.value = "待整理";
      photoData = "";
      photoName = "";
      resetClassification();
      preview.src = "";
      preview.classList.add("hidden");
      captureBtn.classList.remove("hidden");
      cameraAction.classList.remove("hidden");
      reviewActions.classList.add("hidden");
      uploadBtn.classList.add("hidden");
      retakeBtn.classList.add("hidden");
      rescanBtn.classList.remove("hidden");
      retryCameraBtn.classList.remove("hidden");
      setMode("photo");
      showMessage(scanStatus === "not_found" ? "未取得商品連結，請拍標籤；上傳後再補連結" : "已取得淘寶連結，請拍整張標籤", scanStatus === "not_found" ? "warn" : "ok");
    }

    function getScanBoxCss() {
      return {
        left: parseFloat(cameraCard.style.getPropertyValue("--box-left")) || 0,
        top: parseFloat(cameraCard.style.getPropertyValue("--box-top")) || 0,
        size: parseFloat(cameraCard.style.getPropertyValue("--box-size")) || 180
      };
    }

    function captureAndUpload() {
      if (isUploading) return;

      if (!camera.videoWidth || !camera.videoHeight) {
        showMessage("相機尚未準備好，請稍等", "warn");
        return;
      }

      if (qrStatus !== "not_found" && !isTaobaoLink(productUrl.value)) {
        showMessage("商品連結無效，請重新掃描或選擇直接拍照", "bad");
        return;
      }

      const maxSide = 1280;
      let width = camera.videoWidth;
      let height = camera.videoHeight;

      if (width >= height && width > maxSide) {
        height = Math.round(height * maxSide / width);
        width = maxSide;
      } else if (height > width && height > maxSide) {
        width = Math.round(width * maxSide / height);
        height = maxSide;
      }

      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(camera, 0, 0, width, height);

      photoData = canvas.toDataURL("image/jpeg", 0.74);

      const aiMaxSide = 900;
      let aiWidth = width;
      let aiHeight = height;

      if (aiWidth >= aiHeight && aiWidth > aiMaxSide) {
        aiHeight = Math.round(aiHeight * aiMaxSide / aiWidth);
        aiWidth = aiMaxSide;
      } else if (aiHeight > aiWidth && aiHeight > aiMaxSide) {
        aiWidth = Math.round(aiWidth * aiMaxSide / aiHeight);
        aiHeight = aiMaxSide;
      }

      canvas.width = aiWidth;
      canvas.height = aiHeight;
      ctx.drawImage(camera, 0, 0, aiWidth, aiHeight);
      classifyPhotoData = canvas.toDataURL("image/jpeg", 0.62);

      photoName = "label-" + Date.now() + ".jpg";
      preview.src = photoData;
      preview.classList.remove("hidden");
      updateSortOverlay("分類中", true);
      sortOverlay.classList.remove("hidden");

      stopStream();
      captureBtn.classList.add("hidden");
      cameraAction.classList.add("hidden");
      reviewActions.classList.remove("hidden");
      uploadBtn.classList.remove("hidden");
      retakeBtn.classList.remove("hidden");
      rescanBtn.classList.add("hidden");
      retryCameraBtn.classList.add("hidden");
      showMessage("請確認照片清楚，再按確定上傳", "ok");
      classifyLabelPhoto();
    }

    async function retakePhoto() {
      if (isUploading) return;

      photoData = "";
      classifyPhotoData = "";
      photoName = "";
      updateSortOverlay("待分類", true);
      sortOverlay.classList.add("hidden");
      resetClassification();
      preview.src = "";
      preview.classList.add("hidden");
      captureBtn.classList.remove("hidden");
      cameraAction.classList.remove("hidden");
      reviewActions.classList.add("hidden");
      uploadBtn.classList.add("hidden");
      retakeBtn.classList.add("hidden");
      rescanBtn.classList.remove("hidden");
      retryCameraBtn.classList.remove("hidden");
      showMessage("請把整張標籤放進畫面後拍照", "");
      await startCamera();
    }

    async function submitData() {
      isUploading = true;
      captureBtn.disabled = true;
      uploadBtn.disabled = true;
      retakeBtn.disabled = true;
      showMessage("正在上傳...", "");

      const now = new Date();
      const params = new URLSearchParams();
      const clientRequestId = "taobao-" + now.getTime() + "-" + Math.random().toString(36).slice(2, 10);

      params.append("mode", "taobaoIntake");
      params.append("clientRequestId", clientRequestId);
      params.append("tenantId", TENANT.id);
      params.append("source", qrStatus === "not_found" ? "taobao-no-qr" : "taobao");
      params.append("qrStatus", qrStatus);
      params.append("productUrl", productUrl.value.trim());
      params.append("product_url", productUrl.value.trim());
      params.append("status", statusInput.value);
      params.append("ocrStatus", "待 OCR");
      params.append("scanTime", now.toLocaleString("zh-TW", { hour12: false }));
      params.append("timestamp", now.toISOString());
      params.append("photoName", photoName);
      params.append("photoData", photoData);
      params.append("sort_area", selectedSortArea);
      params.append("ai_sort_area", aiSortArea);
      params.append("ai_confidence", aiConfidence);
      params.append("ai_reason", aiReason);
      params.append("ai_classified_at", aiClassifiedAt);

      params.append("packageNo", "");
      params.append("productName", "");
      params.append("product_name", "");
      params.append("spec", "");
      params.append("category", "");
      params.append("originalPrice", "");
      params.append("original_price", "");
      params.append("suggestedPrice", "");

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: params
        });
        const text = await response.text();
        let payload = null;

        try {
          payload = JSON.parse(text);
        } catch (parseError) {
          // Some iPhone webviews expose Google's redirect page instead of JSON.
        }

        if (response.ok && payload && payload.status === "success") {
          showMessage("上傳成功，準備掃下一件", "ok");
          setTimeout(resetToScan, 700);
        } else if (payload && payload.status === "error") {
          isUploading = false;
          captureBtn.disabled = false;
          uploadBtn.disabled = false;
          retakeBtn.disabled = false;
          showMessage("上傳失敗：" + (payload.message || "請稍後重試"), "bad");
        } else {
          throw new Error("Apps Script did not return a valid upload response");
        }
      } catch (error) {
        console.warn(error);

        try {
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            body: params
          });
          showMessage("已補送上傳，準備掃下一件", "ok");
          setTimeout(resetToScan, 700);
        } catch (fallbackError) {
          console.error(fallbackError);
          isUploading = false;
          captureBtn.disabled = false;
          uploadBtn.disabled = false;
          retakeBtn.disabled = false;
          showMessage("上傳出錯：" + fallbackError.message, "bad");
        }
      }
    }

    async function classifyLabelPhoto() {
      if (!photoData) return;

      const runId = ++classifyRunId;
      aiCard.classList.remove("hidden");
      aiCategory.textContent = "分類中...";
      aiDetail.textContent = "AI 正在讀取標籤，最多等 3 秒。";
      showMessage("AI 分類中，可先確認照片；逾時也能上傳", "warn");

      const params = new URLSearchParams();
      params.append("mode", "classifyLabel");
      params.append("tenantId", TENANT.id);
      params.append("imageData", classifyPhotoData || photoData);

      const timeout = new Promise(function(resolve) {
        setTimeout(function() {
          resolve({
            status: "timeout",
            sort_area: "待分類",
            confidence: "low",
            reason: "AI 分類超過 3 秒，先保留待分類"
          });
        }, 3000);
      });

      const request = fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: params
      })
        .then(function(response) {
          return response.text();
        })
        .then(function(text) {
          try {
            return JSON.parse(text);
          } catch (error) {
            return {
              status: "error",
              sort_area: "待分類",
              confidence: "low",
              reason: text || error.message
            };
          }
        })
        .catch(function(error) {
          return {
            status: "error",
            sort_area: "待分類",
            confidence: "low",
            reason: error.message
          };
        });

      const data = await Promise.race([request, timeout]);

      if (runId !== classifyRunId || !photoData) {
        return;
      }

      reviewActions.classList.remove("hidden");
      uploadBtn.classList.remove("hidden");
      retakeBtn.classList.remove("hidden");

      if (!isUploading) {
        uploadBtn.disabled = false;
        retakeBtn.disabled = false;
      }

      if (data.status === "success" && data.sort_area) {
        aiSortArea = data.sort_area;
        aiConfidence = data.confidence || "low";
        aiReason = data.reason || "";
        aiClassifiedAt = new Date().toISOString();
        setSelectedCategory(aiSortArea);
        renderAiResult(aiSortArea, aiConfidence, aiReason, data.product_hint || "", data.elapsed_ms || 0, data.source_category || "");
        showMessage("AI 已建議分貨區，可直接上傳或手動改分類", "ok");
        return;
      }

      aiSortArea = "待分類";
      aiConfidence = data.confidence || "low";
      aiReason = data.reason || data.message || "AI 分類未完成";
      aiClassifiedAt = new Date().toISOString();
      setSelectedCategory("待分類");
      renderAiResult("待分類", aiConfidence, aiReason, "", data.elapsed_ms || 0);
      showMessage("AI 分類未完成，仍可直接上傳", "warn");
    }

    function renderAiResult(area, confidence, reason, hint, elapsedMs, sourceCategory) {
      aiCard.classList.remove("hidden");
      aiCategory.textContent = area || "待分類";

      const parts = [];

      if (confidence) {
        parts.push("信心：" + confidence);
      }

      if (elapsedMs) {
        parts.push("後端：" + Math.round(elapsedMs / 100) / 10 + " 秒");
      }

      if (hint) {
        parts.push("商品：" + hint);
      }

      if (sourceCategory) {
        parts.push("品類：" + sourceCategory);
      }

      if (reason) {
        parts.push("原因：" + reason);
      }

      aiDetail.textContent = parts.join("｜") || "可手動改分類。";
    }

    function setSelectedCategory(category) {
      selectedSortArea = categoryButtons.some(function(button) { return button.dataset.category === category; }) ? category : "待分類";
      categoryButtons.forEach(function(button) {
        button.classList.toggle("active", button.dataset.category === selectedSortArea);
      });
      updateSortOverlay(selectedSortArea, selectedSortArea === "待分類" || selectedSortArea === "分類中");
    }

    function updateSortOverlay(category, isPending) {
      sortOverlayValue.textContent = category || "待分類";
      sortOverlay.classList.toggle("pending", !!isPending);
    }

    function resetClassification() {
      classifyRunId++;
      categoryPicker.open = false;
      selectedSortArea = "待分類";
      aiSortArea = "";
      aiConfidence = "";
      aiReason = "";
      aiClassifiedAt = "";
      setSelectedCategory("待分類");
      updateSortOverlay("待分類", true);
      aiCategory.textContent = "待分類";
      aiDetail.textContent = "拍照後會自動分析標籤。";
      aiCard.classList.add("hidden");
    }

    function resetToScan() {
      isUploading = false;
      qrStatus = "pending";
      captureBtn.disabled = false;
      uploadBtn.disabled = false;
      retakeBtn.disabled = false;
      productUrl.value = "";
      photoData = "";
      classifyPhotoData = "";
      photoName = "";
      updateSortOverlay("待分類", true);
      sortOverlay.classList.add("hidden");
      resetClassification();
      preview.src = "";
      preview.classList.add("hidden");
      captureBtn.classList.remove("hidden");
      cameraAction.classList.remove("hidden");
      reviewActions.classList.add("hidden");
      uploadBtn.classList.add("hidden");
      retakeBtn.classList.add("hidden");
      rescanBtn.classList.remove("hidden");
      retryCameraBtn.classList.remove("hidden");
      setMode("scan");
      updateScanBox();
      showMessage("請把左下角淘寶 QR 放進白框", "");

      if (!stream) {
        startCamera();
      }
    }
  </script>
